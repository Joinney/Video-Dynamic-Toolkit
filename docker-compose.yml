services:
  reelssoda:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reelssoda_studio
    ports:
      - "3000:3000"
      - "8501:8501"
    volumes:
      - .:/app
      - ./Soda_Reels_Videos:/app/Soda_Reels_Videos
    environment:
      - PORT=3000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
