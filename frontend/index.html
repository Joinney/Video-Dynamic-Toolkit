<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Dynamic Toolkit - Soda Reels & MinuteDrama Downloader & AI Dubbing Studio</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="/vendor/tailwind.js"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                300: '#93c5fd',
                400: '#60a5fa',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#1e3a8a',
                950: '#172554',
              }
            }
          }
        }
      };
    }
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // Bắt lỗi toàn cục để không bao giờ bị treo màn hình chờ vô tận
    window.addEventListener('error', function(e) {
      const root = document.getElementById('root');
      if (root && root.querySelector('.animate-spin')) {
        root.innerHTML = `
          <div class="flex flex-col items-center justify-center min-h-screen text-slate-600 gap-3 p-6 text-center">
            <div class="text-rose-600 font-bold text-xl mb-1">⚠️ Lỗi tải giao diện</div>
            <div class="bg-white border border-rose-200 text-rose-700 text-xs p-4 rounded-xl max-w-lg overflow-auto font-mono text-left shadow-md">
              ${e.message || 'Lỗi không xác định khi nạp script'}<br/>
              <span class="text-slate-400">${e.filename || ''}:${e.lineno || ''}</span>
            </div>
            <button onclick="window.location.reload(true)" class="mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold shadow-xs transition">
              🔄 Tải lại trang (Xoá cache)
            </button>
          </div>
        `;
      }
    });
  </script>
</head>
<body class="bg-[#f0f7ff] text-slate-800 min-h-screen antialiased font-sans selection:bg-blue-600 selection:text-white">
  <div id="root">
    <!-- Loading state until React boots up -->
    <div class="flex flex-col items-center justify-center min-h-screen text-slate-600 gap-4">
      <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
      <p class="font-medium text-sm tracking-wide text-blue-600">Đang khởi tạo Video Dynamic Toolkit...</p>
    </div>
  </div>

  <!-- React Application Bundle -->
  <script src="/js/app.js?v=2.4.0-blue-white"></script>
</body>
</html>
