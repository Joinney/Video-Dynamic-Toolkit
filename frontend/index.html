<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Dynamic Toolkit - Soda Reels & MinuteDrama Downloader & AI Dubbing Studio</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="/vendor/tailwind.js"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f5f3ff',
                100: '#ede9fe',
                200: '#ddd6fe',
                300: '#c4b5fd',
                400: '#a78bfa',
                500: '#8b5cf6',
                600: '#7c3aed',
                700: '#6d28d9',
                800: '#5b21b6',
                900: '#4c1d95',
                950: '#2e1065',
              }
            }
          }
        }
      };
    }
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // Bắt lỗi toàn cục để không bao giờ bị treo màn hình chờ vô tận
    window.addEventListener('error', function(e) {
      const root = document.getElementById('root');
      if (root && root.querySelector('.animate-spin')) {
        root.innerHTML = `
          <div class="flex flex-col items-center justify-center min-h-screen text-slate-300 gap-3 p-6 text-center">
            <div class="text-rose-500 font-bold text-xl mb-1">⚠️ Lỗi tải giao diện</div>
            <div class="bg-slate-900 border border-rose-500/30 text-rose-300 text-xs p-4 rounded-xl max-w-lg overflow-auto font-mono text-left">
              ${e.message || 'Lỗi không xác định khi nạp script'}<br/>
              <span class="text-slate-500">${e.filename || ''}:${e.lineno || ''}</span>
            </div>
            <button onclick="window.location.reload(true)" class="mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-semibold transition">
              🔄 Tải lại trang (Xoá cache)
            </button>
          </div>
        `;
      }
    });
  </script>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen antialiased font-sans selection:bg-brand-500 selection:text-white">
  <div id="root">
    <!-- Loading state until React boots up -->
    <div class="flex flex-col items-center justify-center min-h-screen text-slate-400 gap-4">
      <div class="w-12 h-12 border-4 border-brand-500/20 border-t-brand-500 rounded-full animate-spin"></div>
      <p class="font-medium text-sm tracking-wide text-slate-300">Đang khởi tạo Video Dynamic Toolkit...</p>
    </div>
  </div>

  <!-- React Application Bundle -->
  <script src="/js/app.js?v=2.3.0"></script>
</body>
</html>
